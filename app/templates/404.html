{% extends 'base.html' %}

{% block title %}Beyond the Walls — Narmo{% endblock %}

{% block content %}
<div class="container py-5" style="min-height:70vh;display:flex;align-items:center;">
    <div class="row justify-content-center w-100">
        <div class="col-lg-6 text-center">
            <div style="font-size:8rem;font-weight:900;line-height:1;color:var(--accent);opacity:0.3;letter-spacing:-0.06em;">404</div>
            <div style="font-size:2rem;font-weight:800;margin-bottom:0.5rem;color:var(--dark);">You've wandered beyond the Walls</div>
            <p style="color:var(--gray);font-size:1.05rem;margin-bottom:2rem;">
                This page doesn't exist. A Titan must have gotten it.
            </p>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="{{ url_for('main.index') }}" class="btn-primary-narmo">
                    <i class="bi bi-house"></i> Retreat to Safety
                </a>
                <a href="{{ url_for('products.product_list') }}" class="btn-outline-narmo" style="border-color:var(--border);color:var(--text);">
                    Scout Supplies
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
