{% extends 'base.html' %}

{% block title %}Edit Product — Narmo{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="section-title mb-0">
            <span class="accent-bar"></span>
            <h2>Edit Product</h2>
        </div>
        <a href="{{ url_for('admin.product_list') }}" class="btn btn-outline-secondary btn-sm">&larr; Back</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="dashboard-card">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label-narmo">Name</label>
                                <input type="text" name="name" class="form-control-narmo" value="{{ product.name }}" required maxlength="200">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-narmo">Slug</label>
                                <input type="text" name="slug" class="form-control-narmo" value="{{ product.slug }}" maxlength="200" placeholder="Auto-generated">
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label-narmo">Description</label>
                            <textarea name="description" class="form-control-narmo" rows="4" maxlength="5000">{{ product.description or '' }}</textarea>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-4">
                                <label class="form-label-narmo">Price ($)</label>
                                <input type="number" name="price" class="form-control-narmo" value="{{ product.price }}" step="0.01" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-narmo">Stock</label>
                                <input type="number" name="stock" class="form-control-narmo" value="{{ product.stock }}" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-narmo">Genre</label>
                                <input type="text" name="genre" class="form-control-narmo" value="{{ product.genre or '' }}" maxlength="100" placeholder="e.g. Action">
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label-narmo">Category</label>
                                <select name="category_id" class="form-control-narmo" required>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-narmo">Vendor</label>
                                <select name="vendor_id" class="form-control-narmo">
                                    <option value="">— No Vendor —</option>
                                    {% for v in vendors %}
                                    <option value="{{ v.id }}" {% if v.id == product.vendor_id %}selected{% endif %}>{{ v.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label-narmo">Product Image</label>
                            <div class="d-flex align-items-center gap-3">
                                <div style="width:100px;height:100px;border-radius:var(--radius-sm);overflow:hidden;background:var(--slate-100);flex-shrink:0;">
                                    <img id="image-preview" src="{{ url_for('static', filename='images/products/' + product.image_url) if product.image_url else 'https://placehold.co/100x100?text=No+Image' }}"
                                         alt="Preview" style="width:100%;height:100%;object-fit:cover;">
                                </div>
                                <div class="flex-grow-1">
                                    <input type="file" name="image" id="image-input" class="form-control-narmo" accept="image/jpeg,image/png,image/webp,image/gif">
                                    <small class="text-muted">Leave empty to keep current image. Accepted: JPEG, PNG, WebP, GIF (max 16MB)</small>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3 form-check">
                            <input type="checkbox" name="is_featured" id="is_featured" class="form-check-input" {% if product.is_featured %}checked{% endif %}>
                            <label class="form-check-label" for="is_featured">Featured product</label>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn" style="background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:0.5rem 2rem;">
                                <i class="bi bi-check-lg"></i> Save Changes
                            </button>
                            <a href="{{ url_for('admin.product_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
document.getElementById('image-input')?.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('image-preview').src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
});
</script>
{% endblock %}
