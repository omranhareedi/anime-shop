{% extends 'base.html' %}

{% block title %}Register — Narmo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="section-title">
                <span class="accent-bar"></span>
                <h2>Register</h2>
            </div>
            <p class="text-gray">Create an account to join the Survey Corps.</p>
            <div class="checkout-card">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label-narmo">Username</label>
                        <input type="text" name="username" class="form-control-narmo" value="{{ username or '' }}" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Email</label>
                        <input type="email" name="email" class="form-control-narmo" value="{{ email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Password</label>
                        <input type="password" name="password" class="form-control-narmo" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control-narmo" required>
                    </div>
                    <button type="submit" class="btn-primary-narmo w-100 justify-content-center">Create Account</button>
                </form>
            </div>
            <p class="text-center mt-3 text-gray">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
