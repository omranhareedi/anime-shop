{% extends 'base.html' %}

{% block title %}Register — Narmo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="auth-icon mb-3"><i class="bi bi-shield-fill-check"></i></div>
                <h4 class="fw-800 mb-1">Join the Corps</h4>
                <p class="text-gray text-sm">Create your account to start shopping</p>
            </div>
            <p class="creed-text text-center mx-auto mb-4">"The only ones who can change the world are those who are willing to <strong>dedicate their hearts</strong>."</p>
            <div class="auth-card corner-flourish">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label-narmo">Username</label>
                        <div class="input-wrap">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" name="username" class="form-control-narmo" value="{{ username or '' }}" placeholder="Choose a username" required minlength="3">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Email</label>
                        <div class="input-wrap">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" name="email" class="form-control-narmo" value="{{ email or '' }}" placeholder="your@email.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Password</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" name="password" id="reg-password" class="form-control-narmo" placeholder="Min 6 characters" required minlength="6">
                            <button type="button" id="reg-pw-toggle" class="pw-toggle" tabindex="-1" aria-label="Toggle password"><i class="bi bi-eye-slash"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Confirm Password</label>
                        <div class="input-wrap">
                            <i class="bi bi-shield-lock input-icon"></i>
                            <input type="password" name="confirm_password" class="form-control-narmo" placeholder="Repeat password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary-narmo w-100 justify-content-center">Create Account</button>
                </form>
            </div>
            <p class="text-center mt-3 text-sm text-gray">Already enlisted? <a href="{{ url_for('auth.login') }}" style="color:var(--accent);font-weight:600;">Sign in</a></p>
        </div>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
document.getElementById('reg-pw-toggle').addEventListener('click', function() {
    var pw = document.getElementById('reg-password');
    var eye = this.querySelector('i');
    if (pw.type === 'password') { pw.type = 'text'; eye.className = 'bi bi-eye'; }
    else { pw.type = 'password'; eye.className = 'bi bi-eye-slash'; }
});
</script>
{% endblock %}
