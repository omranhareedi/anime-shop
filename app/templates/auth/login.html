{% extends 'base.html' %}

{% block title %}Login — Narmo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="section-title">
                <span class="accent-bar"></span>
                <h2>Login</h2>
            </div>
            <p class="text-gray">Sign in to access the admin dashboard.</p>
            <div class="checkout-card">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label-narmo">Username</label>
                        <input type="text" name="username" class="form-control-narmo" value="{{ username or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-narmo">Password</label>
                        <input type="password" name="password" class="form-control-narmo" required>
                    </div>
                    <button type="submit" class="btn-primary-narmo w-100 justify-content-center">Sign In</button>
                </form>
            </div>
            <p class="text-center mt-3 text-gray">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
